# =============================================================================
#  R E P S   ·   lang-forge
# =============================================================================
[package]
name    = "lang-forge"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "LexerSketch: forge a working language front end - lexer, parser, and lossless syntax tree - from a .lsf schematic."

# Keywords (5 max)
keywords = ["language", "generator", "parser", "compiler", "dsl"]

# Categories
categories = ["development-tools", "compilers", "parsing"]

# Links
homepage      = "https://github.com/jamesgober/lang-forge"
repository    = "https://github.com/jamesgober/lang-forge"
documentation = "https://docs.rs/lang-forge"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lang_forge"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["syntax-lang/std", "diag-lang/std", "pass-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The family's lossless concrete syntax tree. A forged language parses into a
# `syntax_lang::Node`, so its trees feed the formatter, incremental reparser,
# language server, and tree-sitter crates of the family unchanged.
syntax-lang = { version = "1", default-features = false }
# Diagnostics. Schematic errors and parse errors are `diag_lang::Diagnostic`s
# with labelled spans, rendered with source context by `diag_lang::Renderer`.
diag-lang = { version = "1", default-features = false }
# The pass manager. A schematic names its capabilities; `Language::pipeline`
# assembles the matching passes, in schematic order, into a `PassManager`.
pass-lang = { version = "1", default-features = false }
# UAX #31 identifier rules (XID_Start / XID_Continue) for Unicode identifiers.
unicode-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
